<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Joshua Vivo. I take over live software and make it safe.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#6d7dff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#6d5cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6d5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="#090b11"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7d8799">
      <text x="64" y="84"><tspan fill="#22d3ee">~/shadow-vivo</tspan> $ whoami</text>
      <rect x="298" y="69" width="10" height="19" fill="#8b5cf6">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="62" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5" fill="#f4f6fb">Joshua Vivo</text>
    <rect x="64" y="184" width="420" height="3" rx="1.5" fill="url(#line)"/>
    <text x="64" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#c9d1e3">I take over live software and make it safe.</text>
    <text x="64" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#7d8799" letter-spacing="1">PAYMENTS  ·  AUTH  ·  DATA  ·  AGENT TOOLING</text>

    <g transform="translate(985 146)">
      <path d="M-120 -96 H120 L0 112 Z" fill="none" stroke="url(#g)" stroke-width="2" stroke-opacity="0.25" stroke-linejoin="round"/>
      <path d="M-120 -96 H120 L0 112 Z" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="150 580">
        <animate attributeName="stroke-dashoffset" from="730" to="0" dur="6s" repeatCount="indefinite"/>
      </path>
      <text x="0" y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="800" font-style="italic" letter-spacing="-2" fill="url(#g)">SV</text>
      <text x="0" y="148" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="5" fill="#7d8799">SHADOW VIVO LLC</text>
    </g>
  </g>
</svg>
