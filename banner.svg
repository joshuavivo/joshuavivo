<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Joshua Vivo, software engineer, Shadow Vivo LLC. I take over live software and make it safe.">
  <defs><clipPath id="r"><rect width="1200" height="320" rx="18"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="#f6f4ef"/>
    <rect x="0" y="0" width="8" height="320" fill="#1f8a70"/>
    <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.25" fill="none" stroke="#d6d1c6" stroke-width="1.5"/>
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="68" y="86" font-size="16" font-weight="700" letter-spacing="2.4" fill="#1f8a70">SOFTWARE ENGINEER  ·  SHADOW VIVO LLC</text>
      <text x="65" y="166" font-size="70" font-weight="800" letter-spacing="-2" fill="#1d2228">Joshua Vivo</text>
      <text x="68" y="218" font-size="27" font-weight="600" letter-spacing="-0.3" fill="#1d2228">I take over live software and <tspan fill="#1f8a70">make it safe.</tspan></text>
      <circle cx="76" cy="262" r="6" fill="#1f8a70"/>
      <circle cx="76" cy="262" r="6" fill="none" stroke="#1f8a70" stroke-width="2">
        <animate attributeName="r" values="6;15" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="96" y="268" font-size="17" font-weight="500" fill="#4f5964">Payments, auth, data and agent tooling</text>
    </g>
    <image x="880" y="62" width="232" height="198.6" xlink:href="data:image/png;base64," href="data:image/png;base64,"/>
  </g>
</svg>
